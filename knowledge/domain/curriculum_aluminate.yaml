records:
- id: src_chemguide_aqua_hydroxide
  record_type: source
  source_type: textbook
  citation: Jim Clark, Chemguide, Reactions of hexaaqua metal ions with hydroxide
    ions. https://www.chemguide.co.uk/inorganic/complexions/aquaoh.html and aloh.gif
    (accessed 2026-09-27).
- id: ev_aluminium_hydroxide_alkali
  record_type: evidence
  source_id: src_chemguide_aqua_hydroxide
  stance: supports
  claim_summary: Chemguide explicitly shows white aluminium hydroxide precipitate
    dissolving in excess NaOH to [Al(H2O)2(OH)4]-. The school-level aqueous identity
    omits coordinated spectator water as [Al(OH)4]-, and represents the precipitate
    as Al(OH)3. The authored dissolution step is Al(OH)3(s) + NaOH(aq) -> Na[Al(OH)4](aq),
    not a prediction of the final mixture after adding an unspecified amount of base
    to Al3+. NaAlO2/AlO2- are not aliases of these hydrated-composition identities.
    No complex geometry or hydration equilibrium is inferred.
