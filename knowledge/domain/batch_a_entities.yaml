records:
  - id: ev_batch_a_ionic_identity_and_solubility
    record_type: evidence
    source_id: src_openstax_chemistry_2e
    claim_summary: "OpenStax Chemistry 2e sections 2.6 and 4.2 support the authored ionic-compound formulas and ion charges, complete ionic-equation treatment of soluble strong electrolytes, solubility of Group 1, ammonium, and nitrate salts, the stated halide and sulfate exceptions, and general insolubility of carbonates outside the listed exceptions."
    stance: supports

  - id: ev_batch_a_element_identities
    record_type: evidence
    source_id: src_openstax_chemistry_2e
    claim_summary: "OpenStax Chemistry 2e section 2.5 identifies calcium (Ca), bromine (Br), and iodine (I); section 2.6 explicitly describes calcium with 20 protons and bromine with 35 protons; the textbook periodic table supplies iodine atomic number 53; and section 18.11 identifies bromine and iodine as halogens."
    stance: supports

  - id: ent_substance_khco3
    record_type: entity
    entity_kind: substance
    terms: {preferred: potassium hydrogen carbonate, aliases: [potassium bicarbonate]}
    semantic_keys: [{scheme: formula.unit, value: KHCO3}]
    payload:
      substance_kind: pure_compound
      composition:
        components:
          - {element_id: ent_element_k, count: 1}
          - {element_id: ent_element_h, count: 1}
          - {element_id: ent_element_c, count: 1}
          - {element_id: ent_element_o, count: 3}
        net_charge: 0
    facet_assertions:
      - {facet_key: classification.salt, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_batch_a_ionic_identity_and_solubility]}
      - {facet_key: classification.hydrogen_carbonate, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_f3b_carbonate_acid]}
    property_assertions:
      - {property_key: electrolyte.strength, value_state: known, value: strong, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_batch_a_ionic_identity_and_solubility]}
      - {property_key: solubility.class, value_state: known, value: soluble, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_batch_a_ionic_identity_and_solubility]}
    speciation_profiles:
      - profile_key: aqueous_complete_dissociation
        context: {medium: aqueous}
        model: strong_electrolyte_complete_dissociation
        products:
          - {target_id: ent_species_k_plus, coefficient: {numerator: 1, denominator: 1}}
          - {target_id: ent_species_hco3_minus, coefficient: {numerator: 1, denominator: 1}}
        evidence_ids: [ev_batch_a_ionic_identity_and_solubility]
    evidence_ids: [ev_batch_a_ionic_identity_and_solubility, ev_f3b_carbonate_acid]

