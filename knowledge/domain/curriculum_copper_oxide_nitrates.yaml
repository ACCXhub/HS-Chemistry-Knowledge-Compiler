records:
- id: ev_curriculum_copper_oxide_nitrates
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e 19.1 (https://openstax.org/books/chemistry-2e/pages/19-1-occurrence-preparation-and-properties-of-transition-metals-and-their-compounds,
    checked 2026-09-27) identifies copper(II) oxide CuO and transition-metal oxides reacting with acids. Section 4.2 Table
    4.1 supports nitrate solubility, and existing canonical Ca2+/Cu2+/NO3- identities establish Ca(NO3)2 and Cu(NO3)2 stoichiometry.
    These records close product identities for already bounded oxide/carbonate acidification, hydroxide precipitation and
    curated Cu2+ displacement; nitrate here is a spectator salt anion, not permission to treat nitric acid as non-oxidizing.
  stance: supports
- id: ent_substance_cuo
  record_type: entity
  entity_kind: substance
  terms:
    preferred: copper(II) oxide
    aliases:
    - 氧化铜
  semantic_keys:
  - scheme: formula.unit
    value: CuO
  payload:
    substance_kind: pure_compound
    composition:
      components:
      - element_id: ent_element_cu
        count: 1
      - element_id: ent_element_o
        count: 1
      net_charge: 0
  facet_assertions:
  - facet_key: classification.basic_oxide
    value_state: known
    value: true
    fact_kind: intrinsic
    evidence_ids:
    - ev_curriculum_copper_oxide_nitrates
  evidence_ids:
  - ev_curriculum_copper_oxide_nitrates
