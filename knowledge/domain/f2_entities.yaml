records:
  - id: src_f2_fixture
    record_type: source
    source_type: fixture
    citation: "F2/F3A architecture executable fixture; not a corpus authority"

  - id: ev_f2_reactions
    record_type: evidence
    source_id: src_f2_fixture
    claim_summary: "Supports the deliberately tiny precipitation and neutralization fixture semantics."
    stance: supports

  - {id: ent_element_h, record_type: entity, entity_kind: element, terms: {preferred: hydrogen}, semantic_keys: [{scheme: element.symbol, value: H}], payload: {atomic_number: 1, symbol: H}}
  - {id: ent_element_o, record_type: entity, entity_kind: element, terms: {preferred: oxygen}, semantic_keys: [{scheme: element.symbol, value: O}], payload: {atomic_number: 8, symbol: O}}
  - {id: ent_element_n, record_type: entity, entity_kind: element, terms: {preferred: nitrogen}, semantic_keys: [{scheme: element.symbol, value: N}], payload: {atomic_number: 7, symbol: N}}
  - {id: ent_element_na, record_type: entity, entity_kind: element, terms: {preferred: sodium}, semantic_keys: [{scheme: element.symbol, value: Na}], payload: {atomic_number: 11, symbol: Na}}
  - {id: ent_element_cl, record_type: entity, entity_kind: element, terms: {preferred: chlorine}, semantic_keys: [{scheme: element.symbol, value: Cl}], payload: {atomic_number: 17, symbol: Cl}}
  - {id: ent_element_ag, record_type: entity, entity_kind: element, terms: {preferred: silver}, semantic_keys: [{scheme: element.symbol, value: Ag}], payload: {atomic_number: 47, symbol: Ag}}

  - id: ent_substance_nacl
    record_type: entity
    entity_kind: substance
    terms: {preferred: sodium chloride}
    semantic_keys: [{scheme: formula.unit, value: NaCl}]
    payload:
      substance_kind: pure_compound
      composition:
        components:
          - {element_id: ent_element_na, count: 1}
          - {element_id: ent_element_cl, count: 1}
        net_charge: 0
    facet_assertions:
      - {facet_key: classification.salt, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_f2_reactions]}
      - {facet_key: classification.chloride, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_f2_reactions]}
    property_assertions:
      - {property_key: electrolyte.strength, value_state: known, value: strong, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_f2_reactions]}
      - {property_key: solubility.class, value_state: known, value: soluble, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_f2_reactions]}
    speciation_profiles:
      - profile_key: aqueous_complete_dissociation
        context: {medium: aqueous}
        model: strong_electrolyte_complete_dissociation
        products:
          - {target_id: ent_species_na_plus, coefficient: {numerator: 1, denominator: 1}}
          - {target_id: ent_species_cl_minus, coefficient: {numerator: 1, denominator: 1}}
        evidence_ids: [ev_f2_reactions]
    evidence_ids: [ev_f2_reactions]

