records:
- id: ev_curriculum_iron_chloride_redox
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e 17.3 Table 17.1 (https://openstax.org/books/chemistry-2e/pages/17-3-electrode-and-cell-potentials,
    checked 2026-09-27) lists Fe3+/Fe2+ +0.771 V, Fe2+/Fe -0.447 V, Cu2+/Cu +0.34 V and Cl2(g)/Cl- +1.35827 V. Author-reviewed
    combinations support the ordinary aqueous teaching pathways Fe + 2Fe3+ -> 3Fe2+, Cu + 2Fe3+ -> Cu2+ + 2Fe2+,
    and Cl2 + 2Fe2+ -> 2Cl- + 2Fe3+. Existing canonical chloride identities supply spectator ions. The records are
    limited to these explicit chloride examples at ambient temperature; the runtime neither computes potentials
    nor predicts general redox products. Copper does not displace elemental iron from Fe2+ in this ordinary aqueous
    pathway.
  stance: supports
