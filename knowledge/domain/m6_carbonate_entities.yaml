      substance_kind: pure_compound
      composition:
        components:
          - {element_id: ent_element_k, count: 2}
          - {element_id: ent_element_c, count: 1}
          - {element_id: ent_element_o, count: 3}
        net_charge: 0
    facet_assertions:
      - {facet_key: classification.salt, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_f3b_carbonate_acid]}
      - {facet_key: classification.carbonate, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_f3b_carbonate_acid]}
    property_assertions:
      - {property_key: electrolyte.strength, value_state: known, value: strong, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_f3b_carbonate_acid]}
      - {property_key: solubility.class, value_state: known, value: soluble, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_f3b_carbonate_acid]}
    speciation_profiles:
      - profile_key: aqueous_complete_dissociation
        context: {medium: aqueous}
        model: strong_electrolyte_complete_dissociation
        products:
          - {target_id: ent_species_k_plus, coefficient: {numerator: 2, denominator: 1}}
          - {target_id: ent_species_co3_2minus, coefficient: {numerator: 1, denominator: 1}}
        evidence_ids: [ev_f3b_carbonate_acid]
    evidence_ids: [ev_f3b_carbonate_acid]
