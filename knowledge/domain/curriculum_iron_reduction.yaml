records:
- id: ev_iron_co_reduction
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e 19.1, blast-furnace section, describes CO reducing
    iron oxides to iron before the iron melts in the lower region. The school-level
    overall reduction is Fe2O3(s) + 3CO(g) -> 2Fe(s) + 3CO2(g). This exact heated,
    non-aqueous teaching equation does not model intermediate oxides, equilibrium
    gas ratios, kinetics or a molten furnace product. Heated is the existing coarse
    high-temperature condition, not a claim that any mild warming suffices.
  stance: supports
- id: ev_iron_thermite
  record_type: evidence
  source_id: src_ncert_metals_nonmetals
  claim_summary: NCERT Science Metals and Non-metals section 3.4.4 explicitly prints
    Fe2O3(s) + 2Al(s) -> 2Fe(l) + Al2O3(s) + heat, describing the strongly exothermic
    thermit reaction and molten metal. The same chapter identifies aluminium as atomic
    number 13. This bounded school-level path requires thermal initiation represented
    by heated and a non-aqueous mixture; it does not claim spontaneous reaction at
    ambient temperature or infer other metal-oxide reductions.
  stance: supports
