records:
- id: ev_curriculum_iron_solid_acid
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: 'OpenStax Chemistry 2e 19.1 (https://openstax.org/books/chemistry-2e/pages/19-1-occurrence-preparation-and-properties-of-transition-metals-and-their-compounds,
    checked 2026-09-27) identifies FeO and Fe2O3, and describes low-oxidation-state metal oxides, hydroxides and
    hydrated oxides reacting with aqueous acids to form salts and water. These authored teaching records use stoichiometric
    FeO/Fe2O3 and the existing Fe(OH)2/Fe(OH)3 school-level identities, without modeling oxide nonstoichiometry
    or hydration. Fe(II) products require a known non-oxidizing acid: FeO or Fe(OH)2 with nitric acid cannot be
    treated as ordinary Fe(II) salt neutralization. The Fe3+/Fe2+ redox distinction is independently supported by
    section 17.3; unspecified oxidation paths remain UNKNOWN. The Rules describe dissolution, not dissolution rate
    or a later atmospheric oxidation step.'
  stance: supports
- id: ev_curriculum_ferric_nitrate
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e 4.2 Table 4.1 (https://openstax.org/books/chemistry-2e/pages/4-2-classifying-chemical-reactions,
    checked 2026-09-27) supports soluble nitrates and insoluble iron hydroxides. Existing Fe3+ and NO3- identities
    establish Fe(NO3)3 composition and its strong-electrolyte ionic representation. These records support ferric
    nitrate as a product of Fe(III) oxide/hydroxide acid dissolution and its immediate precipitation with NaOH/KOH.
    They do not model hydrolysis equilibria or authorize nitric acid as a non-oxidizing acid.
  stance: supports
