      "record_type": "evidence",
      "source_id": "src_openstax_chemistry_2e",
      "stance": "supports",
      "claim_summary": "OpenStax Chemistry 2e 18.11 explicitly gives Cl2(g) + 2Br-(aq) -> Br2(l) + 2Cl-(aq). Section 17.3 Table 17.1 gives Cl2/Cl- +1.35827 V, Br2/Br- +1.0873 V and I2/I- +0.5355 V, and its check-your-learning explicitly supports bromine oxidation of iodide. Cached chapter extracts reviewed 2026-09-28. Author-curated Na/K spectator-salt examples represent ordinary aqueous ambient displacement with separated Br2(l) or I2(s) products, not concentrations, dissolved iodine/triiodide equilibrium or final mixture speciation. The 17.3 answer's Br2(s) typo is not adopted: 18.11 identifies ambient bromine as liquid. Runtime does not calculate potentials or extrapolate other oxidants."
