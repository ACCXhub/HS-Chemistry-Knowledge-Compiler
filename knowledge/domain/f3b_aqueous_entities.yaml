records:
  - id: src_openstax_chemistry_2e
    record_type: source
    source_type: textbook
    citation: "OpenStax, Chemistry 2e: sections 4.2 Classifying Chemical Reactions, 14.3 Relative Strengths of Acids and Bases, and 18.6 Occurrence, Preparation, and Properties of Carbonates. https://openstax.org/details/books/chemistry-2e (accessed 2026-09-08)"

  - id: ev_f3b_solubility_precipitation
    record_type: evidence
    source_id: src_openstax_chemistry_2e
    claim_summary: "Supports aqueous solubility-rule use for common salts, including insoluble AgCl and BaSO4, and precipitation/net-ionic representations."
    stance: supports

  - id: ev_f3b_strong_acid_base
    record_type: evidence
    source_id: src_openstax_chemistry_2e
    claim_summary: "Supports HNO3 as a common strong acid and KOH as a common strong base in water, together with strong-electrolyte aqueous treatment."
    stance: supports

  - id: ev_f3b_carbonate_acid
    record_type: evidence
    source_id: src_openstax_chemistry_2e
    claim_summary: "Supports acid + hydrogen-carbonate/carbonate gas-evolution chemistry producing carbon dioxide and water."
    stance: supports

  - id: ev_f3b_identity_context
    record_type: evidence
    source_id: src_openstax_chemistry_2e
    claim_summary: "Supports distinguishing molecular formula-bearing species from aqueous acid/electrolyte behavior, which is medium-dependent."
    stance: qualifies

  - id: ent_element_c
    record_type: entity
    entity_kind: element
    terms: {preferred: carbon}
    semantic_keys: [{scheme: element.symbol, value: C}]
    payload: {atomic_number: 6, symbol: C}

  - id: ent_element_s
    record_type: entity
    entity_kind: element
    terms: {preferred: sulfur}
    semantic_keys: [{scheme: element.symbol, value: S}]
    payload: {atomic_number: 16, symbol: S}

  - id: ent_element_k
    record_type: entity
    entity_kind: element
    terms: {preferred: potassium}
    semantic_keys: [{scheme: element.symbol, value: K}]
    payload: {atomic_number: 19, symbol: K}

  - id: ent_element_ba
    record_type: entity
    entity_kind: element
    terms: {preferred: barium}
    semantic_keys: [{scheme: element.symbol, value: Ba}]
    payload: {atomic_number: 56, symbol: Ba}

  - id: ent_species_hcl_molecule
    record_type: entity
    entity_kind: species
    terms: {preferred: hydrogen chloride molecule}
    semantic_keys: [{scheme: formula.molecule, value: HCl}]
    payload:
      species_kind: molecule
      formal_charge: 0
      composition:
        components:
          - {element_id: ent_element_h, count: 1}
          - {element_id: ent_element_cl, count: 1}
        net_charge: 0
    evidence_ids: [ev_f3b_identity_context]

  - id: ent_material_hydrochloric_acid_aqueous
    record_type: entity
    entity_kind: material_system
    terms: {preferred: hydrochloric acid aqueous solution}
    semantic_keys: [{scheme: material_system.slug, value: hydrochloric-acid-aqueous}]
    payload:
      material_system_kind: solution
    facet_assertions:
      - {facet_key: classification.acid, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_f3b_identity_context]}
    property_assertions:
      - {property_key: acid.strength, value_state: known, value: strong, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_f3b_identity_context]}
      - {property_key: electrolyte.strength, value_state: known, value: strong, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_f3b_identity_context]}
    evidence_ids: [ev_f3b_identity_context]

  - id: ent_species_na_plus
    record_type: entity
    entity_kind: species
    terms: {preferred: sodium ion}
    semantic_keys: [{scheme: formula.ion, value: Na+}]
    payload:
      species_kind: ion
      formal_charge: 1
      composition:
        components: [{element_id: ent_element_na, count: 1}]
        net_charge: 1
    evidence_ids: [ev_f3b_solubility_precipitation]

