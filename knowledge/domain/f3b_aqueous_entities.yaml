    evidence_ids: [ev_f3b_carbonate_acid]

  - id: ent_substance_bacl2
    record_type: entity
    entity_kind: substance
    terms: {preferred: barium chloride}
    semantic_keys: [{scheme: formula.unit, value: BaCl2}]
