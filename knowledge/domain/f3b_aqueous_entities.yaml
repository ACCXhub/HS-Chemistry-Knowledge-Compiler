      composition:
        components:
          - {element_id: ent_element_ba, count: 1}
          - {element_id: ent_element_cl, count: 2}
        net_charge: 0
    facet_assertions:
      - {facet_key: classification.salt, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_f3b_solubility_precipitation]}
      - {facet_key: classification.chloride, value_state: known, value: true, fact_kind: intrinsic, evidence_ids: [ev_f3b_solubility_precipitation]}
    property_assertions:
      - {property_key: electrolyte.strength, value_state: known, value: strong, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_f3b_solubility_precipitation]}
      - {property_key: solubility.class, value_state: known, value: soluble, fact_kind: contextual, context: {medium: aqueous}, evidence_ids: [ev_f3b_solubility_precipitation]}
    speciation_profiles:
      - profile_key: aqueous_complete_dissociation
        context: {medium: aqueous}
        model: strong_electrolyte_complete_dissociation
        products:
          - {target_id: ent_species_ba_2plus, coefficient: {numerator: 1, denominator: 1}}
          - {target_id: ent_species_cl_minus, coefficient: {numerator: 2, denominator: 1}}
        evidence_ids: [ev_f3b_solubility_precipitation]
    evidence_ids: [ev_f3b_solubility_precipitation]

