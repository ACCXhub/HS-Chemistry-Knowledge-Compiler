records:
- id: src_chemguide_iron_chemistry
  record_type: source
  source_type: textbook
  citation: 'Jim Clark, Chemguide, Iron: iron(II) and iron(III) chemistry, https://www.chemguide.co.uk/inorganic/transition/iron.html
    (accessed 2026-09-27).'
- id: src_ncert_metals_nonmetals
  record_type: source
  source_type: textbook
  citation: NCERT Science, Metals and Non-metals, section 3.2.2, PDF page 7, reprint 2026-27. https://www.ncert.nic.in/textbook/pdf/jesc103.pdf
    (accessed 2026-09-27). Used as evidence for the iron/steam equation, not as the mainland curriculum scope.
- id: ev_iron_magnetite_paths
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e 19.1 identifies Fe3O4 among oxides prepared by heating transition metals
    in air, and describes oxide acid dissolution. The authored magnetite identity is iron(II,III) oxide; its selected
    hydrochloric-acid products retain Fe(II) and Fe(III) in a 1:2 ratio. Balancing verifies Fe3O4 + 8HCl -> FeCl2
    + 2FeCl3 + 4H2O. This is an exact mixed-valence case, not a guessed single-valence cation or permission to substitute
    nitric acid.
  stance: supports
- id: ev_iron_hydroxide_oxygen
  record_type: evidence
  source_id: src_chemguide_iron_chemistry
  claim_summary: Chemguide explicitly describes oxygen in air oxidizing the iron(II) hydroxide precipitate to iron(III)
    hydroxide in the aqueous precipitation experiment. Using the existing school-level hydroxide identities, independent
    atom/charge balance gives 4Fe(OH)2 + O2 + 2H2O -> 4Fe(OH)3. Oxygen and liquid water are explicit inputs; the
    engine does not assume atmospheric exposure or rewrite the earlier Fe(OH)2 precipitation step.
  stance: supports
- id: ev_iron_steam_magnetite
  record_type: evidence
  source_id: src_ncert_metals_nonmetals
  claim_summary: NCERT section 3.2.2 explicitly distinguishes iron not reacting with cold/hot liquid water from
    its reaction with steam, and prints 3Fe(s) + 4H2O(g) -> Fe3O4(s) + 4H2(g). The illustrated experiment supplies
    heat. The exact Rule requires heated steam and does not generalize the magnesium steam oxide product.
  stance: supports
- id: ev_iron_heated_conversions
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e 19.1 prints 2Fe(s) + 3Cl2(g) -> 2FeCl3(s), identifies Fe3O4 as the oxide
    formed when iron is heated in air, and describes preparation of transition-metal oxides by heating hydroxides.
    These authored school-level cases represent the balanced iron/chlorine and iron/oxygen reactions and 2Fe(OH)3
    -> Fe2O3 + 3H2O(g). Heated is required; ordinary aqueous-medium inputs are excluded. Fe(OH)3 uses the existing
    pedagogical identity rather than a new hydration-phase model. These are reaction equations, not predictions
    of the final mixture under arbitrary reagent ratios.
  stance: supports
