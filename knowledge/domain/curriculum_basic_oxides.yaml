records:
- id: ev_curriculum_basic_oxides
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e section 18.9, Metal Oxides and Hydroxides (https://openstax.org/books/chemistry-2e/pages/18-9-occurrence-preparation-and-compounds-of-oxygen,
    checked 2026-09-26), describes representative-metal oxides reacting with acids to form salts and water, explicitly CaO/HCl
    and Na2O/HNO3, and alkali-metal oxides forming hydroxides with water. This batch admits only Na2O, MgO and CaO with strong
    aqueous acids and known soluble canonical salts, plus Na2O with liquid water. Oxidation state is fixed by each reviewed
    oxide identity, not guessed from an element tag. The printed Na2O/water example omits a coefficient; atom conservation
    independently requires two NaOH. No general oxide hydration, amphoteric or peroxide pathway is inferred.
