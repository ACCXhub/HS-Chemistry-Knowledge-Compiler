records:
- id: ev_curriculum_iron_ii_paths
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e 17.3, Table 17.1 (https://openstax.org/books/chemistry-2e/pages/17-3-electrode-and-cell-potentials,
    checked 2026-09-27) gives Fe2+/Fe -0.447 V, H+/H2 0.00 V, Cu2+/Cu +0.34 V, Zn2+/Zn -0.7618 V and Mg2+/Mg -2.372 V. Curated
    combinations support Fe to Fe(II) with non-oxidizing acid or Cu(II), Zn/Mg displacement of Fe(II), and no Fe-to-Zn(II)
    displacement in the represented ordinary aqueous pathways. Only these explicit pairwise facts are authored; the runtime
    does not extrapolate an activity ordering, compute potentials, or choose Fe(III). Nitric-acid, passivation and competing
    oxidants remain outside these facts.
  stance: supports
- id: ev_curriculum_iron_ii_solubility
  record_type: evidence
  source_id: src_openstax_chemistry_2e
  claim_summary: OpenStax Chemistry 2e 4.2 Table 4.1 (https://openstax.org/books/chemistry-2e/pages/4-2-classifying-chemical-reactions,
    checked 2026-09-27) lists soluble chlorides and sulfates with exceptions not including Fe(II), and insoluble hydroxides
    with exceptions not including Fe(II). Combined with the explicit Fe2+ identity in section 17.3 this supports FeCl2 and
    FeSO4 composition, aqueous dissociation, and immediate Fe(OH)2 precipitation. Subsequent oxidation of Fe(OH)2 by oxygen
    is a separate unmodeled step.
  stance: supports
