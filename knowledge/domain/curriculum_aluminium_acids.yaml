records:
- id: ev_curriculum_aluminium_acid
  record_type: evidence
  source_id: src_ncert_metals_nonmetals
  stance: supports
  claim_summary: NCERT Science Metals and Non-metals section 3.2.1 explicitly gives
    Al2O3 + 6HCl -> 2AlCl3 + 3H2O and identifies Al2O3 as amphoteric. Section 3.2.3
    describes Al evolving hydrogen with dilute HCl (Mg > Al > Zn > Fe), excluding
    oxidizing nitric acid from this hydrogen pathway. The aqueous teaching representation
    AlCl3 -> Al3+ + 3Cl- supports product construction and ionic cancellation, not
    hydrolysis equilibria or dry covalent AlCl3. Aluminium oxide remains a solid without
    a complete-dissociation profile. No aluminium displacement activity ordering or
    passivation model is inferred.
