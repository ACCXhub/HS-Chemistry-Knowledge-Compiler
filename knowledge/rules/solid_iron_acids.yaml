records:
- id: rule_solid_iron_feo_acid
  record_type: rule
  version: 1.0.0
  decision_domain: aqueous_solid_iron_acid
  match:
    reactants:
    - bind: solid
      target_id: ent_substance_feo
      phase: solid
    - bind: acid
      entity_kind: substance
      phase: aqueous
      required_facets:
      - classification.acid
  context:
    medium: aqueous
    temperature_regime: ambient
  predicates:
  - operator: equals
    subject: property
    binding: acid
    key: acid.strength
    expected: strong
  - operator: equals
    subject: property
    binding: acid
    key: electrolyte.strength
    expected: strong
  - operator: equals
    subject: property
    binding: acid
    key: acid.redox_character
    expected: non_oxidizing
  products:
  - phase: aqueous
    construct:
      kind: ionic_pair
      cation_source:
        kind: exact_entity
        target_id: ent_species_fe_2plus
      anion_source:
        kind: speciation
        binding: acid
  - target_id: ent_substance_h2o
    phase: liquid
  validators:
  - atoms_conserved
  - charge_conserved
  evidence_ids:
  - ev_curriculum_iron_solid_acid
