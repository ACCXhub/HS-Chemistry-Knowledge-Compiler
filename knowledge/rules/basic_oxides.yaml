records:
- id: rule_basic_oxide_na2o_acid
  record_type: rule
  version: 1.0.0
  decision_domain: aqueous_basic_oxide_acid
  match:
    reactants:
    - bind: oxide
      target_id: ent_substance_na2o
      phase: solid
    - bind: acid
      entity_kind: substance
      phase: aqueous
      required_facets:
      - classification.acid
  context:
    medium: aqueous
    temperature_regime: ambient
  predicates:
  - operator: equals
    subject: property
    binding: acid
    key: acid.strength
    expected: strong
  - operator: equals
    subject: property
    binding: acid
    key: electrolyte.strength
    expected: strong
  products:
  - phase: aqueous
    construct:
      kind: ionic_pair
      cation_source:
        kind: exact_entity
        target_id: ent_species_na_plus
      anion_source:
        kind: speciation
        binding: acid
  - target_id: ent_substance_h2o
    phase: liquid
  validators:
  - atoms_conserved
  - charge_conserved
  evidence_ids:
  - ev_curriculum_basic_oxides
