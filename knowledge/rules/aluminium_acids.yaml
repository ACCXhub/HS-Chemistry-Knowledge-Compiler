      target_id: ent_substance_al2o3
      phase: solid
    - bind: acid
      entity_kind: substance
      phase: aqueous
      required_facets:
      - classification.acid
  context:
    medium: aqueous
    temperature_regime: ambient
  predicates:
  - operator: equals
    subject: property
    binding: acid
    key: acid.strength
    expected: strong
  - operator: equals
    subject: property
    binding: acid
    key: electrolyte.strength
    expected: strong
  products:
  - phase: aqueous
    construct:
      kind: ionic_pair
      cation_source:
        kind: exact_entity
        target_id: ent_species_al_3plus
      anion_source:
        kind: speciation
        binding: acid
  - target_id: ent_substance_h2o
    phase: liquid
  validators:
  - atoms_conserved
  - charge_conserved
  evidence_ids:
  - ev_curriculum_aluminium_acid
