records:
  - id: rule_m11_water_reactive_metal_hydrogen
    record_type: rule
    version: 1.0.0
    decision_domain: metal_liquid_water_hydrogen
    match:
      reactants:
        - bind: metal
          entity_kind: substance
          phase: solid
          required_facets: [classification.metal]
        - bind: water
          target_id: ent_substance_h2o
          phase: liquid
    context:
      temperature_regime: ambient
    predicates:
      - {operator: equals, subject: property, binding: metal, key: metal.water_reactivity, expected: reacts}
    products:
      - phase: aqueous
        construct:
          kind: ionic_pair
          cation_source:
            kind: relation_target
            binding: metal
            relation_key: metal.product_cation
          anion_source:
            kind: exact_entity
            target_id: ent_species_oh_minus
      - {target_id: ent_substance_h2, phase: gas}
    validators: [atoms_conserved, charge_conserved]
    evidence_ids: [ev_m11_alkali_metal_water_reactivity, ev_m11_alkali_metal_identity_and_cations]
