records:
  - id: rule_m13_metal_silver_nitrate_displacement
    record_type: rule
    version: 1.0.0
    decision_domain: aqueous_silver_nitrate_displacement
    match:
      reactants:
        - bind: metal
          entity_kind: substance
          phase: solid
          required_facets: [classification.metal]
        - bind: silver_nitrate
          target_id: ent_substance_agno3
          phase: aqueous
    context:
      medium: aqueous
    predicates:
      - operator: equals
        subject: relation
        binding: metal
        key: metal.displaces_cation
        target_id: ent_species_ag_plus
        expected: true
    products:
      - phase: aqueous
        construct:
          kind: ionic_pair
          cation_source:
            kind: relation_target
            binding: metal
            relation_key: metal.product_cation
          anion_source:
            kind: speciation
            binding: silver_nitrate
      - {target_id: ent_substance_elemental_ag, phase: solid}
    validators: [atoms_conserved, charge_conserved]
    evidence_ids: [ev_m13_silver_nitrate_identity_and_speciation, ev_m13_metal_silver_displacement]
