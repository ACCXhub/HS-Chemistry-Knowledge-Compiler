records:
  - id: rule_solid_calcium_carbonate_acid
    record_type: rule
    version: 1.0.0
    decision_domain: aqueous_acid_base
    match:
      reactants:
        - bind: acid
          entity_kind: substance
          phase: aqueous
          required_facets: [classification.acid]
        - bind: carbonate
          target_id: ent_substance_caco3
          phase: solid
    context:
      medium: aqueous
    predicates:
      - {operator: equals, subject: property, binding: acid, key: acid.strength, expected: strong}
      - {operator: equals, subject: property, binding: acid, key: electrolyte.strength, expected: strong}
    blockers:
      - {key: temperature_regime, equals: frozen}
    products:
      - phase: aqueous
        construct:
          kind: ionic_pair
          cation_source: {kind: exact_entity, target_id: ent_species_ca_2plus}
          anion_source: {kind: speciation, binding: acid}
      - {target_id: ent_substance_co2, phase: gas}
      - {target_id: ent_substance_h2o, phase: liquid}
    validators: [atoms_conserved, charge_conserved]
    evidence_ids: [ev_solid_calcium_carbonate_acid, ev_f3b_carbonate_acid]
